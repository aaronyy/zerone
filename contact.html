<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Start a conversation — Zerone</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <div id="chrome-top"></div>
    <main class="cta-split">
      <div class="left">
        <h2>What are you trying to build?</h2>
        <ul>
          <li>A professional reputation.</li>
          <li>A new healthcare business.</li>
          <li>A stronger brand and patient experience.</li>
        </ul>
      </div>
      <div class="right">
        <h3>Start a conversation.</h3>
        <p>Healthcare Brand & Patient Experience Consultancy<br />Ho Chi Minh City, Vietnam</p>
        <form class="contact-form" data-signup="contact">
          <input type="text" name="name" placeholder="Name" required />
          <input type="email" name="email" placeholder="Email" required />
          <input type="tel" name="phone" placeholder="Phone / WhatsApp" />
          <select name="intent" required>
            <option value="" disabled selected>What are you trying to build?</option>
            <option>A professional reputation</option>
            <option>A new healthcare business</option>
            <option>A stronger brand and patient experience</option>
          </select>
          <textarea name="note" rows="4" placeholder="A few lines on the clinic or practice"></textarea>
          <button class="btn" type="submit">Send</button>
        </form>
        <p class="notice" data-notice="contact">Thank you. We will be in touch.</p>
      </div>
    </main>
    <div id="chrome-bottom"></div>
    <script src="js/site.js"></script>
  </body>
</html>
